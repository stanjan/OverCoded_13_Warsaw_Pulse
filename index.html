<style>
    @layer base {
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    ::-webkit-scrollbar { display: none; }

    @keyframes sunGlow {
      0%, 100% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.4)); }
      50% { transform: rotate(15deg) scale(1.08); filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.7)); }
    }

    @keyframes radarPulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      70%, 100% { transform: scale(2.2); opacity: 0; }
    }

    .anim-sun-icon {
      display: inline-block;
      animation: sunGlow 7s ease-in-out infinite;
    }

    .radar-pulse-ring {
      position: absolute;
      inset: -3px;
      border-radius: 9999px;
      background-color: rgba(0, 81, 213, 0.25);
      animation: radarPulse 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    /* Smooth collapsible transitions */
    #sheet-content {
      transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  margin-bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: max-height, opacity, transform;
    }

    #sheet-chevron {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
<title>Warszawa Pulse — Warsaw AI</title>
<meta name="description" content="Twój mobilny asystent Warszawy — miejsca, mapa i rozmowa.">
<meta name="theme-color" content="#f7f9fb">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

<body class="bg-surface font-sans text-on-surface antialiased h-screen w-screen flex flex-col relative overflow-hidden select-none" style="font-family: &quot;Plus Jakarta Sans&quot;, sans-serif;"><main class="app-shell" aria-label="Warszawa Pulse">
<!-- MAP CANVAS: Full Screen Orange Background (#ea580c) with Grid Pattern -->
<div class="absolute inset-0 z-0 overflow-hidden" id="map-canvas-container" aria-label="Mapa Warszawy" style="background-color: #ea580c;">
<div id="city-map"></div><!-- Subtle Dot Grid Representation -->
<div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#ffffff 1.75px, transparent 1.75px); background-size: 24px 24px;"></div>
<!-- Central Google Maps Integration Pin Badge -->
<div class="absolute inset-0 flex items-center justify-center pb-28 pointer-events-none">
<div class="flex items-center gap-2.5 px-4 py-2 rounded-full bg-black/25 backdrop-blur-md text-white/95 border border-white/20 shadow-lg">
<span class="material-symbols-outlined text-[20px] text-amber-300">location_on</span>
<span class="text-[13px] font-medium tracking-wide">Obszar pod integrację Google Maps</span>
</div>
</div>
</div>
<!-- 1. FLOATING TOP WEATHER BAR: Perfectly Centered Horizontally -->
<div title="Przykładowe dane pogodowe" class="weather-bar absolute top-4 left-1/2 -translate-x-1/2 z-20 pt-safe pointer-events-auto">
<div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface/95 backdrop-blur-xl shadow-md border border-black/5 text-on-surface whitespace-nowrap active:scale-95 transition-all" style="box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.18), 0 8px 10px -6px rgba(0, 0, 0, 0.12);">
<span class="material-symbols-outlined text-amber-500 text-[18px] anim-sun-icon">wb_sunny</span>
<span class="text-[10px] text-on-surface-variant">Przykład</span>
<span class="text-[13px] font-bold">19°C</span>
<span class="text-outline-variant">•</span>
<span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
<span class="text-[12px] text-emerald-700 font-semibold">AQI 24</span>
<span class="text-outline-variant">•</span>
<span class="text-[12px] text-on-surface-variant">Zachód 19:42</span>
</div>
</div>
<!-- BOTTOM SHEET CONTAINER (WITH LOCATION BUTTON SITTING DIRECTLY ABOVE IT) -->
<div class="drawer-container absolute inset-x-0 bottom-16 z-30 flex flex-col pointer-events-none">
<!-- 2. COMPASS / LOCATION BUTTON: Positioned on the right side immediately ABOVE the bottom sheet -->
<div class="flex justify-end px-margin pb-3 pointer-events-auto">
<button class="relative w-11 h-11 rounded-full bg-surface/95 backdrop-blur-md text-primary flex items-center justify-center shadow-lg active:scale-90 border border-black/5 hover:text-secondary transition-all" id="gps-button" style="box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.22), 0 4px 6px -4px rgba(0, 0, 0, 0.15);" aria-label="Wyśrodkuj mapę Warszawy" title="Wyśrodkuj mapę Warszawy">
<div class="radar-pulse-ring"></div>
<span class="material-symbols-outlined text-[22px]">my_location</span>
</button>
</div>
<!-- BOTTOM SHEET (INTERACTIVE DRAWER) -->
<section class="w-full bg-surface rounded-t-[2rem] shadow-[0_-12px_32px_rgba(9,20,38,0.14)] border-t border-outline-variant/30 flex flex-col pointer-events-auto transition-all duration-350 ease-[cubic-bezier(0.16,1,0.3,1)]" id="ai-sheet" style="box-shadow: 0 -12px 30px -4px rgba(0, 0, 0, 0.2), 0 -4px 12px -2px rgba(0, 0, 0, 0.12);">
<!-- Drag Handle and Toggle Button Bar (Clickable header to toggle collapse/expand) -->
<div class="w-full flex flex-col items-center pt-3 pb-1 px-margin cursor-pointer group touch-none select-none hover:bg-black/[0.02] active:bg-black/[0.04] transition-colors rounded-t-[2rem]" id="sheet-toggle">
<div class="relative flex items-center justify-center w-full py-1">
<div class="w-12 h-1.5 rounded-full bg-outline-variant/80 group-hover:bg-outline transition-colors" id="drag-handle-pill"></div>
<button aria-label="Zwiń panel" aria-controls="sheet-content" class="absolute right-1 -top-1 w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90" id="collapse-toggle-btn" type="button" aria-expanded="true" title="Zwiń panel">
<span class="material-symbols-outlined text-[22px]" id="sheet-chevron">keyboard_arrow_up</span>
</button>
</div>
</div>

<div class="w-full flex flex-col overflow-hidden px-margin" id="sheet-content" >

<div class="w-full pt-1 pb-3 text-center flex flex-col items-center shrink-0"><h1 class="text-[22px] text-slate-900 font-bold tracking-tight" style="letter-spacing: -0.03em; font-weight: 800;"><span class="anim-title">Dzień dobry, Warszawa.</span></h1>
<p class="text-[15px] text-slate-500 font-normal mt-0.5 tracking-tight" style="line-height: 1.4;">Czym żyje dziś miasto?</p></div>

<div class="w-full pb-4 shrink-0">
<span class="text-[11px] font-semibold text-slate-400 uppercase block mb-2 text-center" style="letter-spacing: 0.12em;">SZYBKIE ZAPYTANIA</span>
<div class="w-full flex items-stretch gap-2.5 overflow-x-auto pb-1 justify-start">
<!-- Card: Trasa nad Wisłę -->
<button class="prompt-chip shrink-0 w-[148px] p-3 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex flex-col justify-between text-left shadow-xs hover:border-secondary/50 hover:shadow-md active:scale-95 transition-all cursor-pointer group" style="box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);">
<div class="flex items-center justify-between w-full mb-2">
<div class="w-8 h-8 rounded-xl bg-secondary/10 text-secondary flex items-center justify-center shrink-0 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[18px]">water</span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[16px] group-hover:text-secondary group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">arrow_outward</span>
</div>
<div>
<span class="text-[14px] font-bold text-[#0f172a] block leading-tight mb-0.5 group-hover:text-secondary">Trasa nad Wisłę</span>
<span class="text-[11px] text-on-surface-variant block">Odkryj bulwary</span>
</div>
</button>
<!-- Card: Opóźnienia ZTM -->
<button class="prompt-chip shrink-0 w-[148px] p-3 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex flex-col justify-between text-left shadow-xs hover:border-amber-500/50 hover:shadow-md active:scale-95 transition-all cursor-pointer group" style="box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);">
<div class="flex items-center justify-between w-full mb-2">
<div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center shrink-0 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[18px]">schedule</span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[16px] group-hover:text-amber-500 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">arrow_outward</span>
</div>
<div>
<span class="text-[14px] font-bold text-[#0f172a] block leading-tight mb-0.5 group-hover:text-amber-600">Opóźnienia ZTM</span>
<span class="text-[11px] text-on-surface-variant block">Sprawdź komunikację</span>
</div>
</button>
<!-- Card: Najbliższe Veturilo -->
<button class="prompt-chip shrink-0 w-[148px] p-3 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex flex-col justify-between text-left shadow-xs hover:border-emerald-500/50 hover:shadow-md active:scale-95 transition-all cursor-pointer group" style="box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);">
<div class="flex items-center justify-between w-full mb-2">
<div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center shrink-0 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[18px]">pedal_bike</span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[16px] group-hover:text-emerald-600 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">arrow_outward</span>
</div>
<div>
<span class="text-[14px] font-bold text-[#0f172a] block leading-tight mb-0.5 group-hover:text-emerald-600">Najbliższe Veturilo</span>
<span class="text-[11px] text-on-surface-variant block">Zapytaj o rowery</span>
</div>
</button>
</div>
</div>
</div>
</div><!-- SEARCH BAR SECTION (Remains visible at the bottom of the sheet) -->
<div class="px-margin pb-3 pt-1 w-full shrink-0" id="search-container">
<div class="relative flex items-center gap-2 p-1.5 pl-2.5 rounded-full bg-surface-container-lowest shadow-md border border-outline-variant/40 focus-within:border-secondary focus-within:ring-2 focus-within:ring-secondary/15 transition-all cursor-text" id="search-bar-wrapper" style="box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.12), 0 3px 6px -2px rgba(0, 0, 0, 0.08);">

<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
<input class="flex-1 bg-transparent border-0 font-sans text-[15px] text-on-surface placeholder:text-outline focus:outline-none focus:ring-0 px-1 py-1 min-w-0" id="search-bar-input" aria-label="Zapytaj asystenta o Warszawę" maxlength="4000" enterkeyhint="send" autocomplete="off" placeholder="Zapytaj asystenta AI o Warszawę..." type="text">
<button class="w-9 h-9 rounded-full bg-secondary text-on-secondary flex items-center justify-center shadow-md hover:bg-secondary/90 active:scale-90 transition-transform shrink-0 cursor-pointer" id="ai-submit-btn" aria-label="Wyślij pytanie" title="Wyślij" type="button">
<span class="material-symbols-outlined text-[18px]">arrow_upward</span>
</button>
</div>
</div>
</section>
</div>

<nav class="fixed bottom-0 inset-x-0 h-16 z-50 pb-safe bg-surface/95 backdrop-blur-xl border-t border-outline-variant/30 shadow-[0_-4px_20px_rgba(9,20,38,0.06)] flex items-center justify-around px-margin font-sans">
<!-- Pulse (Active) -->
<a aria-current="page" class="flex flex-col items-center justify-center min-w-[54px] h-12 text-secondary transition-all" data-path="city-pulse" href="#">
<span class="material-symbols-outlined text-[24px]">explore</span>
<span class="text-[12px] mt-0.5 font-bold tracking-tight">Pulse</span>
</a>
<!-- Transit -->
<a class="flex flex-col items-center justify-center min-w-[54px] h-12 text-on-surface-variant hover:text-primary transition-all active:scale-95" data-path="transit-live" href="#">
<span class="material-symbols-outlined text-[24px]">subway</span>
<span class="text-[12px] mt-0.5 font-medium tracking-tight">Transit</span>
</a>
<!-- Guide -->

<span class="material-symbols-outlined text-[24px]">local_activity</span>
<span class="text-[12px] mt-0.5 font-medium tracking-tight">Guide</span>
</a>

<span class="text-[12px] mt-0.5 font-medium tracking-tight">Saved</span>
</a>
</nav>
